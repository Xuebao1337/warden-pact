plugins {
    id "net.fabricmc.fabric-loom" version "${loom_version}"
}

version = mod_version
group = mod_group_id
base { archivesName = "wardenpact-fabric-26.3" }

// Resolve third-party Minecraft libraries from their own Maven repositories.
repositories.named("Fabric").configure {
    content {
        includeGroupByRegex "net[.]fabricmc([.].*)?"
        includeGroup "io.github.llamalad7"
    }
}

loom {
    splitEnvironmentSourceSets()
    mods {
        wardenpact {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
}

// Share textures, tags, recipes and enchantment data with the NeoForge edition.
sourceSets.main.resources.srcDir("../src/main/resources")

fabricApi {
    configureTests {
        createSourceSet = true
        modId = "wardenpacttests"
        enableGameTests = true
        enableClientGameTests = false
        eula = true
    }
}

processResources {
    def modVersion = project.version
    inputs.property "version", modVersion
    filesMatching("fabric.mod.json") { expand version: modVersion }
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.encoding = "UTF-8"
}

tasks.named("jar", Jar) {
    from("../LICENSE") { into "META-INF" }
}
