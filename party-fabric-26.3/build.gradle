plugins {
    id "net.fabricmc.fabric-loom" version "${loom_version}"
}

version = mod_version
group = mod_group_id
base { archivesName = "wardendance-fabric-26.3" }

// Resolve third-party Minecraft libraries from their own Maven repositories.
repositories.named("Fabric").configure {
    content {
        includeGroupByRegex "net[.]fabricmc([.].*)?"
        includeGroup "io.github.llamalad7"
    }
}

loom {
    splitEnvironmentSourceSets()
    mods {
        wardendance {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
}

fabricApi {
    configureTests {
        createSourceSet = true
        modId = "wardendancetests"
        enableGameTests = true
        enableClientGameTests = false
        eula = true
    }
}

processResources {
    def modVersion = project.version
    inputs.property "version", modVersion
    filesMatching("fabric.mod.json") { expand version: modVersion }
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.encoding = "UTF-8"
}

tasks.named("jar", Jar) {
    from("../LICENSE") { into "META-INF" }
}

sourceSets.test.compileClasspath += sourceSets.client.output + sourceSets.client.compileClasspath
sourceSets.test.runtimeClasspath += sourceSets.client.output + sourceSets.client.runtimeClasspath
tasks.register('checkDanceAnimation', JavaExec) {
    dependsOn tasks.named('testClasses'), tasks.named('clientClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.wardendance.test.DanceAnimationCheck'
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(25) }
}
tasks.named('test', Test).configure { failOnNoDiscoveredTests = false }
tasks.named('check').configure { dependsOn tasks.named('checkDanceAnimation') }
